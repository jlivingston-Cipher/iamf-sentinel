[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iamf-sentinel"
version = "0.3.2"
description = "IAMF conformance & QC validator — L1 structural + L2 channel-semantics + CI contract (free core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }          # ADR-3 clean-room; whole stack Apache-2.0 (A′, doc 48)
authors = [{ name = "The iamf-sentinel authors" }]
keywords = ["iamf", "immersive-audio", "conformance", "validator", "ci", "loudness"]
dependencies = []                          # standard library only (tomllib) — the frictionless-adoption shape

[project.optional-dependencies]
test = ["pytest>=7"]
# L3 rendered QC (decoder oracle + BS.1770-4 measurement + F29 calibration) is the
# companion plugin `iamf-sentinel-pro` (also Apache-2.0), NOT an extra of this package —
# the seam keeps this core stdlib-pure. See PLUGIN_SEAM.md.

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
packages = ["sentinel", "sentinel.checks", "sentinel.container"]
include-package-data = true

[tool.setuptools.package-data]
sentinel = ["profiles/*.toml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Lint with ruff defaults (E4/E7/E9/F). The fixture/dev tier deliberately uses a
# compact one-line idiom; the per-file ignores below codify that two-tier style.
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"fixtures/build.py" = ["E702"]     # fluent byte-writer one-liners (deliberate)
"tests/test_sentinel.py" = ["E702"]

